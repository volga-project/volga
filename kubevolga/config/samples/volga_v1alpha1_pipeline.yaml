apiVersion: volga.io/v1alpha1
kind: VolgaPipeline
metadata:
  name: sample-pipeline
  namespace: default
spec:
  workers:
    replicas: 3
  image: volga:latest
  imagePullPolicy: IfNotPresent
  master:
    nodeSelector:
      volga.io/role: infra
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
  worker:
    # Required hostname anti-affinity is omitted so CI (1 volga-worker node) can pack replicas.
    nodeSelector:
      volga.io/role: worker
    tolerations:
      - key: volga.io/role
        operator: Equal
        value: worker
        effect: NoSchedule
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
  holdOnFinish: true
  pipelineSpec:
    execution_mode: Streaming
    parallelism: 6
    execution_profile:
      MasterWorker:
        num_threads_per_task: 4
    state:
      checkpoint_store: in_memory
      operator_backend: in_memory
      maintenance_enabled: true
      maintenance_interval_ms: 1000
    task_assignment_strategy:
      Pipelined:
        slots_per_node: 2
    sources:
      - table_name: test_table
        schema_json: |
          {
            "fields": [
              {
                "name": "value",
                "nullable": false,
                "type": { "name": "utf8" },
                "children": []
              }
            ]
          }
        source:
          Datagen: |
            {
              "rate": null,
              "limit": 60,
              "run_for_s": null,
              "batch_size": 5,
              "fields": {
                "value": { "Key": { "num_unique": 6 } }
              },
              "replayable": true
            }
    sink:
      InMemoryStorageGrpc: |
        {
          "server_addr": "http://volga-test-storage.default.svc.cluster.local:50071"
        }
    sql: "SELECT value FROM test_table"
