# Lightweight Prom + Grafana for Volga bench (not kube-prometheus-stack).
# Apply: kubectl apply -k kubevolga/hack/bench
# UI:    kubectl -n volga-bench port-forward svc/grafana 3000:3000
# Scrapes pods with prometheus.io/{scrape,port,path}. Requires infra nodes (kind-multi).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: volga-bench
resources:
  - namespace.yaml
  - rbac.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana-datasources.yaml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yaml=grafana-dashboards.yaml
  - name: grafana-dashboards
    files:
      - volga-bench.json=dashboards/volga-bench.json
generatorOptions:
  disableNameSuffixHash: true
