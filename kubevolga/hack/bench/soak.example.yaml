# Soak run file for `volga-longrun soak --config`. CLI flags override these fields.
# Checkpoint knobs live on the job (`PipelineSpec.state.checkpoint`), not here.
# `Nx_interval` multiplies that job interval (30s on the default soak job).

env: kube
duration_secs: 3600
scenario: kill
kill_after_checkpoint: 1
dump: /tmp/soak
prom_url: http://127.0.0.1:9090
launch:
  worker_count: 2
oracles:
  watermark_stale_while_sending: 30s
  lag_p99: 1.5x_window
  lag_p99_sustain: 60s
  checkpoint_silence_intervals: 3
  restore_catchup: 3x_interval
  allow_checkpoint_fail_outside_kill: false
  allow_unexpected_fatal: false
