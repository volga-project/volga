name: Rust tests

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile
        type: choice
        options:
          - default
          - unit
          - grpc-based
          - kube
          - all
          - stress
        default: default

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule' && inputs.profile != 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      TEST_PROFILE: ${{ inputs.profile || 'default' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - uses: helm/kind-action@v1
        if: env.TEST_PROFILE == 'kube' || env.TEST_PROFILE == 'all'
        with:
          install_only: true
      - run: scripts/test "$TEST_PROFILE"
      - if: always() && (env.TEST_PROFILE == 'kube' || env.TEST_PROFILE == 'all')
        run: scripts/kube-test-env destroy

  kube-stress:
    if: github.event_name == 'schedule' || inputs.profile == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: scripts/test stress --env kube --all --runs-per-shard 10 --shards 1 --fresh-cluster
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kube-stress-logs-shard-${{ matrix.shard }}
          path: target/stress/
          if-no-files-found: warn
          retention-days: 14
