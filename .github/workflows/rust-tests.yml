name: Rust tests

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Every 4h; stress-config alternates inproc vs kube on each tick so each
    # suite can use ~15 runners without sharing the Free-plan pool. Each suite
    # therefore runs about every 8h. Long jobs rely on schedule concurrency
    # (cancel-in-progress: false) so an overrun is not killed.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Test profile (default=unit+inprocess; all=default+docker+kube; kube-stress / inproc-stress)"
        type: choice
        options:
          - default
          - docker
          - kube
          - all
          - kube-stress
          - inproc-stress
        default: default
      stress_test:
        description: "Exact test name for inproc-stress / kube-stress (kube: test_kube_*; empty or schedule → all kube tests)"
        type: string
        default: test_local_multi_worker_window_checkpoint_restore
      stress_machines:
        description: "CI runners (machines) for kube-stress / inproc-stress"
        type: string
        default: "3"
      stress_shards_per_machine:
        description: "Parallel stress processes per machine (kube default 1 = one Kind cluster)"
        type: string
        default: "1"
      stress_runs_per_shard:
        description: "Iterations per shard for kube-stress / inproc-stress"
        type: string
        default: "10"

concurrency:
  # PRs cancel superseded runs; scheduled stress must not cancel itself (jobs can exceed 1h).
  group: rust-tests-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # unit + inprocess. PR/push run the full suite (same as dispatch `all`).
  default-tests:
    if: >
      github.event_name != 'schedule' && (
        github.event_name != 'workflow_dispatch' ||
        inputs.profile == 'default' ||
        inputs.profile == 'all'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      TEST_PROFILE: default
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compile cache even when tests flake so the next run is warm.
          cache-on-failure: true
      - run: scripts/test "$TEST_PROFILE"

  # Parallel, non-blocking (does not fail the workflow).
  # PR/push (full suite) or dispatch: docker | all.
  docker-tests:
    if: >
      github.event_name != 'schedule' && (
        github.event_name != 'workflow_dispatch' ||
        inputs.profile == 'docker' ||
        inputs.profile == 'all'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      VOLGA_DOCKER_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: docker/setup-buildx-action@v3
      - run: scripts/test docker

  # Parallel, non-blocking (does not fail the workflow).
  # PR/push (full suite) or dispatch: kube | all.
  kube-tests:
    if: >
      github.event_name != 'schedule' && (
        github.event_name != 'workflow_dispatch' ||
        inputs.profile == 'kube' ||
        inputs.profile == 'all'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      VOLGA_DOCKER_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: docker/setup-buildx-action@v3
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: scripts/test kube
      - if: always()
        run: scripts/kube-test-env destroy

  # Resolve machines × shards-per-machine for stress jobs.
  # machine = GitHub runner (isolation); shard = parallel process on that runner
  # (kube: usually 1 = one Kind cluster; inproc: usually 1 to avoid interference).
  stress-config:
    if: >
      github.event_name == 'schedule' ||
      inputs.profile == 'kube-stress' ||
      inputs.profile == 'inproc-stress'
    runs-on: ubuntu-latest
    outputs:
      machine_ids: ${{ steps.config.outputs.machine_ids }}
      shards_per_machine: ${{ steps.config.outputs.shards_per_machine }}
      runs_per_shard: ${{ steps.config.outputs.runs_per_shard }}
      # schedule: kube | inproc; workflow_dispatch: dispatch
      schedule_mode: ${{ steps.config.outputs.schedule_mode }}
    steps:
      - id: config
        shell: bash
        run: |
          set -euo pipefail
          schedule_mode=dispatch
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Free org ~18 usable concurrent runners in practice. Alternate so
            # each suite gets a dedicated wave (not half the pool), 15 machines:
            # - inproc 100× window restore ≈ 10–15s/run → ~25–40m
            # - kube 10× --all + fresh Kind ≈ 3–4m/outer-run historically → ~30–45m
            # Cron fires at UTC hours 0,4,8,12,16,20 — alternate by slot so we
            # do not always land on the same suite (hour%2 would be stuck on even).
            hour=$((10#$(date -u +%H)))
            slot=$(( hour / 4 ))
            shards=1
            machines=15
            if (( slot % 2 == 0 )); then
              schedule_mode=inproc
              runs=100
            else
              schedule_mode=kube
              runs=10
            fi
          else
            machines="${{ inputs.stress_machines }}"
            shards="${{ inputs.stress_shards_per_machine }}"
            runs="${{ inputs.stress_runs_per_shard }}"
          fi
          for name in machines shards runs; do
            val="${!name}"
            if [[ ! "$val" =~ ^[1-9][0-9]*$ ]]; then
              echo "$name must be a positive integer, got: $val" >&2
              exit 2
            fi
          done
          if (( machines > 32 )); then
            echo "stress_machines max is 32, got: $machines" >&2
            exit 2
          fi
          machine_ids="$(python3 -c "import json; print(json.dumps(list(range(1, int('${machines}') + 1))))")"
          echo "schedule_mode=$schedule_mode machines=$machines shards_per_machine=$shards runs_per_shard=$runs"
          echo "machine_ids=$machine_ids"
          {
            echo "machine_ids=$machine_ids"
            echo "shards_per_machine=$shards"
            echo "runs_per_shard=$runs"
            echo "schedule_mode=$schedule_mode"
          } >> "$GITHUB_OUTPUT"

  kube-stress:
    needs: stress-config
    if: >
      always() &&
      needs.stress-config.result == 'success' &&
      (
        (github.event_name == 'schedule' && needs.stress-config.outputs.schedule_mode == 'kube') ||
        (github.event_name == 'workflow_dispatch' && inputs.profile == 'kube-stress')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.stress-config.outputs.machine_ids) }}
    env:
      CARGO_INCREMENTAL: "0"
      VOLGA_DOCKER_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: docker/setup-buildx-action@v3
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Run kube stress
        run: |
          set -euo pipefail
          shards="${{ needs.stress-config.outputs.shards_per_machine }}"
          runs="${{ needs.stress-config.outputs.runs_per_shard }}"
          test_name="${{ inputs.stress_test }}"
          echo "kube-stress machine=${{ matrix.machine }} shards_per_machine=$shards runs_per_shard=$runs"
          # Schedule / unset / inproc-default → full kube suite. On-demand can pin a test_kube_*.
          if [[ "${{ github.event_name }}" != "schedule" && -n "$test_name" && "$test_name" == test_kube_* ]]; then
            echo "kube-stress test=$test_name"
            scripts/test stress --env kube --test "$test_name" \
              --runs-per-shard "$runs" \
              --shards "$shards" \
              --fresh-cluster
          else
            scripts/test stress --env kube --all \
              --runs-per-shard "$runs" \
              --shards "$shards" \
              --fresh-cluster
          fi
      # Skip on cancelled so "Cancel workflow" is not blocked by 15× artifact upload.
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: kube-stress-logs-machine-${{ matrix.machine }}
          path: target/stress/
          if-no-files-found: warn
          retention-days: 14

  # Inprocess stress with the same machine × shard knobs (machine = runner isolation).
  inproc-stress:
    needs: stress-config
    if: >
      always() &&
      needs.stress-config.result == 'success' &&
      (
        (github.event_name == 'schedule' && needs.stress-config.outputs.schedule_mode == 'inproc') ||
        (github.event_name == 'workflow_dispatch' && inputs.profile == 'inproc-stress')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.stress-config.outputs.machine_ids) }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run inproc stress
        run: |
          set -euo pipefail
          test_name="${{ inputs.stress_test }}"
          shards="${{ needs.stress-config.outputs.shards_per_machine }}"
          runs="${{ needs.stress-config.outputs.runs_per_shard }}"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Scheduled inproc focuses on the window restore path (same as on-demand default).
            test_name="test_local_multi_worker_window_checkpoint_restore"
          fi
          if [[ -z "$test_name" ]]; then
            echo "stress_test input is required for inproc-stress" >&2
            exit 2
          fi
          echo "inproc-stress machine=${{ matrix.machine }} test=$test_name shards_per_machine=$shards runs_per_shard=$runs"
          scripts/test stress --env local \
            --test "$test_name" \
            --runs-per-shard "$runs" \
            --shards "$shards"
      # Skip on cancelled so "Cancel workflow" is not blocked by 15× artifact upload.
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: inproc-stress-logs-machine-${{ matrix.machine }}
          path: target/stress/
          if-no-files-found: warn
          retention-days: 14
