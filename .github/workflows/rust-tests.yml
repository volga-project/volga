name: Rust tests

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Hourly (GitHub may delay under load; cron minute granularity is the floor).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Test profile
        type: choice
        options:
          - default
          - unit
          - inprocess
          - docker
          - kube
          - all
          - stress
        default: default

concurrency:
  # PRs cancel superseded runs; scheduled stress must not cancel itself (jobs can exceed 1h).
  group: rust-tests-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # default run (unit + inprocess).
  default_tests:
    if: >
      github.event_name != 'schedule' &&
      inputs.profile != 'stress' &&
      inputs.profile != 'docker' &&
      inputs.profile != 'kube'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # `all` still uses this job for default only; docker/kube run as sibling jobs.
      TEST_PROFILE: ${{ inputs.profile == 'all' && 'default' || inputs.profile || 'default' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep compile cache even when tests flake so the next run is warm.
          cache-on-failure: true
      - run: scripts/test "$TEST_PROFILE"

  # Parallel, non-blocking (does not fail the workflow).
  docker_tests:
    if: >
      github.event_name != 'schedule' &&
      inputs.profile != 'stress' &&
      inputs.profile != 'unit' &&
      inputs.profile != 'inprocess' &&
      inputs.profile != 'kube'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      VOLGA_DOCKER_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: docker/setup-buildx-action@v3
      - run: scripts/test docker

  # Parallel, non-blocking (does not fail the workflow).
  kube_tests:
    if: >
      github.event_name != 'schedule' &&
      inputs.profile != 'stress' &&
      inputs.profile != 'unit' &&
      inputs.profile != 'inprocess' &&
      inputs.profile != 'docker'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      VOLGA_DOCKER_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: docker/setup-buildx-action@v3
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: scripts/test kube
      - if: always()
        run: scripts/kube-test-env destroy

  kube-stress:
    if: github.event_name == 'schedule' || inputs.profile == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: "0"
      VOLGA_DOCKER_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: docker/setup-buildx-action@v3
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: scripts/test stress --env kube --all --runs-per-shard 10 --shards 1 --fresh-cluster
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kube-stress-logs-shard-${{ matrix.shard }}
          path: target/stress/
          if-no-files-found: warn
          retention-days: 14
