# Timeouts are suite-scoped via nextest profiles (scripts/test picks the profile).
# No per-test overrides — put slow tests in the matching suite filter instead.

[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }
fail-fast = false

[profile.grpc-based]
slow-timeout = { period = "90s", terminate-after = 1 }
fail-fast = false

# LocalStack / Kafka / docker-backed (scripts/test docker).
[profile.docker]
slow-timeout = { period = "120s", terminate-after = 1 }
fail-fast = false

# Kind / kube (scripts/test kube).
[profile.kube]
slow-timeout = { period = "90s", terminate-after = 1 }
fail-fast = false

# scripts/stress-test (kube-heavy).
[profile.stress]
slow-timeout = { period = "180s", terminate-after = 1 }
fail-fast = false
